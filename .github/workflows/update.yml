# 每個交易日收盤後：抓新資料 → 存回專案 → 重算訊號 → 發佈網頁
name: 每日更新

on:
  schedule:
    # GitHub 免費排程常延遲好幾個小時，所以收盤後每小時都排一次；已抓過的日期會自動跳過
    - cron: "30 8-15 * * 1-5"  # 台北 16:30–23:30 每小時
    - cron: "30 1,8 * * 6"     # 台北週六 9:30、16:30（定案遇到週五休市的週K）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓新資料
        run: python scripts/fetch.py

      - name: 存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || (git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)" && git push)

      - name: 計算訊號
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
